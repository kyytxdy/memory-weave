<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>织忆 · UI 预览</title>
<link rel="stylesheet" href="style.css">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background:
      radial-gradient(60% 50% at 50% 0%, #1a1f3a 0%, transparent 70%),
      radial-gradient(50% 40% at 80% 90%, #10202c 0%, transparent 70%),
      #05070c;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    color: #eef1f8;
  }
</style>
</head>
<body>

<script>
  // 假数据：模拟酒馆上下文，让 index.js 原样跑起来
  const MIN = 60 * 1000;
  const HOUR = 60 * MIN;
  const DAY = 24 * HOUR;
  const now = Date.now();

  const chat = [];
  for (let i = 0; i < 20; i++) {
    chat.push({
      is_user: i % 2 === 0,
      name: i % 2 === 0 ? '林染' : '艾拉',
      mes: `第 ${i + 1} 层的对话内容，用来撑起楼层统计。`,
    });
  }
  chat.push(
    { is_user: true, name: '林染', mes: '这个名字……再想想。' },
    { is_user: false, name: '艾拉', mes: '想你这样，写到天亮也想不出来。' },
  );

  const beats = [
    {
      kind: 'beat', id: 'b1', ts: now - 1.1 * DAY,
      text: '林染在药房后屋翻出一只旧木匣，里面是半张烧焦的地图；艾拉看了一眼就把匣子合上，说这东西不该留在店里。',
      from: 4, to: 4,
    },
    {
      kind: 'beat', id: 'b2', ts: now - 2.6 * HOUR,
      text: '林染趴在桌上写名字，写了又划掉；艾拉端着温水过来放在桌角，扫了眼纸面，问他到底想不出还是不想取。',
      from: 8, to: 8,
    },
    {
      kind: 'beat', id: 'b3', ts: now - 2.1 * HOUR,
      text: '林染说男孩叫林续，艾拉评价这名字听着像催人喝第二碗药，建议换一个；林染反问她有什么更好的。',
      from: 9, to: 9,
    },
    {
      kind: 'beat', id: 'b4', ts: now - 1.4 * HOUR,
      text: '两人为一个名字争了半盏茶，最后定下「林参」。艾拉把纸收走，说写进药簿就算数了，不许再改。',
      from: 10, to: 10,
    },
    {
      kind: 'beat', id: 'b5', ts: now - 42 * MIN,
      text: '艾拉下楼前提起周老板问过林染的来历，林染没接话；楼下药柜的灯一直亮到很晚。',
      from: 11, to: 11,
    },
    {
      kind: 'beat', id: 'b6', ts: now - 12 * MIN,
      text: '林染把潮湿的伞靠在门边，问艾拉明天要不要一起去药市；艾拉没有直接答应，只说看天气。',
      from: 12, to: 12,
    },
  ];

  const arcs = [
    {
      kind: 'arc', id: 'a1', ts: now - 3 * HOUR, from: 1, to: 10,
      text: '林染带着一个捡来的男孩住进艾拉的药房，到这天已是第三天。他手背上的旧伤在换药时被艾拉看见，两人都没提。夜里他在二楼给男孩取名，写了又划，说叫林续，被艾拉一句「听着像催人喝第二碗药」噎住，争到最后定下「林参」，艾拉把纸收走，说写进药簿就不许再改。艾拉临走时提到周老板问过他的来历，林染没有接话。窗外雨一直没停，楼下药柜的灯亮到很晚。',
    },
  ];

  const snapshots = {
    state: {
      kind: 'snapshot',
      id: 's1',
      templateId: 'state',
      title: '当前状态',
      values: {
        scene: '旧书店二楼，雨夜',
        present: '林染、艾拉',
        doing: '给捡来的男孩取名',
        mood: '平静',
        myself: '手里捏着划得乱七八糟的纸，袖口沾了墨',
        other: '端着水杯靠在书架边，语气比白天松',
        thread: '周老板问过林染的来历，还没回答',
      },
      ts: now - 3 * HOUR,
      updatedTs: now - 12 * MIN,
      source: 'auto',
    },
  };

  const entities = {
    person: {
      '林染': {
        kind: 'entity', id: 'e2', templateId: 'person', key: '林染', importance: 5,
        values: {
          name: '林染', role: '借住药房的客人', age: '二十出头',
          time: '第三天的深夜',
          recent: '在纸上给男孩取名，划掉一堆，最后定下「林参」',
          place: '城南药房二楼',
          birthday: '不清楚，大概在夏天',
          look: '手背有旧伤，袖口常沾墨',
        },
        ts: now - 2 * DAY, updatedTs: now - 12 * MIN, lastRound: 12, source: 'auto',
      },
      '艾拉': {
        kind: 'entity', id: 'e1', templateId: 'person', key: '艾拉', importance: 5,
        values: {
          name: '艾拉', role: '药房主人', age: '二十七八',
          relation: '收留我的人', attitude: '表面冷淡，实际处处照应',
          recent: '端着温水上楼，提起周老板问过林染的来历',
          place: '城南药房',
          birthday: '冬至前后',
          look: '左手腕一道旧疤，常年系着灰布',
        },
        ts: now - 2 * DAY, updatedTs: now - 12 * MIN, lastRound: 12, source: 'auto',
      },
      '周老板': {
        kind: 'entity', id: 'e3', templateId: 'person', key: '周老板', importance: 3,
        values: {
          name: '周老板', role: '旧书店老板', age: '五十上下',
          relation: '认识艾拉，欠她一个人情', attitude: '对林染的来路好奇',
          recent: '向艾拉打听林染是什么来路',
          place: '街角旧书店',
        },
        ts: now - 5 * DAY, updatedTs: now - 1.4 * HOUR, lastRound: 10, source: 'auto',
      },
      '陈九': {
        kind: 'entity', id: 'e4', templateId: 'person', key: '陈九', importance: 3,
        values: {
          name: '陈九', role: '码头脚夫', age: '四十上下',
          relation: '替艾拉送过药', attitude: '客气，话不多',
          place: '城南码头',
        },
        ts: now - 9 * DAY, updatedTs: now - 3 * DAY, lastRound: 2,
        absent: true, leftRound: 11, source: 'auto',
      },
    },
  };

  globalThis.SillyTavern = {
    getContext: () => ({
      extensionSettings: {
        'memory-weave': {
          chats: {
            'test::demo': {
              beats, arcs, memos: [], snapshots, entities,
              beatMark: 12, arcMark: 10, fillSig: '18,19', inited: true,
            },
          },
        },
      },
      chat,
      characters: [{ avatar: 'test', name: '艾拉' }],
      characterId: 0,
      name1: '林染',
      name2: '艾拉',
      getCurrentChatId: () => 'demo',
      saveSettingsDebounced: () => {},
      setExtensionPrompt: (k, v) => { window.__lastPrompt = v; },
      generateRaw: async () => '',
      eventSource: {
        on: (evt, fn) => { if (evt === 'app_ready') setTimeout(fn, 0); },
      },
      eventTypes: { APP_READY: 'app_ready' },
      isMobile: () => true,
    }),
  };
</script>

<script src="index.js"></script>

<script>
  // 支持 ?view=records|templates|form|snap|settings 直达某个界面
  const view = new URLSearchParams(location.search).get('view');
  setTimeout(() => {
    const mw = globalThis.MemoryWeave;
    if (!mw) return;
    mw.open();
    setTimeout(() => {
      if (['records', 'templates', 'settings'].includes(view)) {
        document.querySelector(`[data-tab="${view}"]`)?.click();
      } else if (view === 'person') {
        document.querySelector('[data-tab="templates"]')?.click();
        setTimeout(() => document.querySelector('[data-person-toggle]')?.click(), 200);
      } else if (view === 'snap') {
        document.querySelector('[data-tab="templates"]')?.click();
        setTimeout(() => {
          document.querySelector('[data-snap-edit="state"]')?.click();
          setTimeout(() => {
            const b = document.querySelector('.mw-form-body');
            if (b) b.scrollTop = b.scrollHeight;
          }, 450);
        }, 150);
      } else if (view === 'form') {
        document.querySelector('[data-tab="records"]')?.click();
        setTimeout(() => document.querySelector('[data-mw="new-record"]')?.click(), 120);
      } else if (view === 'cost') {
        document.querySelector('[data-tab="settings"]')?.click();
        setTimeout(() => { const b = document.querySelector('.mw-body'); if (b) b.scrollTop = b.scrollHeight; }, 300);
      } else if (view === 'fields') {
        document.querySelector('[data-tab="templates"]')?.click();
        setTimeout(() => document.querySelector('[data-person-fields]')?.click(), 200);
      } else if (view === 'template') {
        document.querySelector('[data-tab="templates"]')?.click();
        setTimeout(() => mw.template(), 120);
      } else if (view === 'expanded') {
        setTimeout(() => document.querySelector('.mw-timeline .mw-card')?.click(), 200);
      }
    }, 160);
  }, 500);
</script>

</body>
</html>
